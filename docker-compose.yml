services:
  # Honeypot Deception Server — deploy on Google Cloud VM
  # Backend stays on Render: https://kurukshetra-backend.onrender.com
  honeypot-server:
    build:
      context: .
      dockerfile: honeypot/docker/Dockerfile
    container_name: kurukshetra-honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH Honeypot (NOT port 22)
      - "8080:8080"   # Web & API Honeypot
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - HONEYPOT_HOST=0.0.0.0
      - SSH_PORT=2222
      - WEB_PORT=8080
      - BACKEND_URL=https://kurukshetra-backend.onrender.com
      - BACKEND_EVENT_ENDPOINT=/api/events
      - HONEYPOT_HOSTNAME=corp-app-prod01
      - SSH_AUTH_MODE=accept_all
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./clone_profiles:/app/clone_profiles
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"



