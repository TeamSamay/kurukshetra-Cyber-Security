apiVersion: v1
kind: Service
metadata:
  name: honeypot-service
  namespace: kurukshetra-deception
  labels:
    app: honeypot-server
spec:
  type: NodePort
  selector:
    app: honeypot-server
  ports:
  - name: ssh
    port: 2222
    targetPort: 2222
    nodePort: 32222
    protocol: TCP
  - name: web-api
    port: 8080
    targetPort: 8080
    nodePort: 30880
    protocol: TCP
